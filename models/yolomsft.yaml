# YOLOv5-MSFT by Rvosuke, GPL-3.0 license

# Parameters
nc: 6  # number of classes
depth_multiple: 1.0  # model depth multiple
width_multiple: 1.0  # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23]       # P3/8
  - [30, 61, 62, 45, 59, 119]      # P4/16
  - [116, 90, 156, 198, 373, 326]  # P5/32

# YOLOv5-MSFT backbone
backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [64, 6, 2, 2]]      # 0-P1/2
  - [-1, 1, C3, [64]]                 # 1
  - [-1, 1, Conv, [128, 3, 2]]        # 2-P2/4
  - [-1, 2, C3, [128]]                # 3
  - [-1, 1, Conv, [256, 3, 2]]        # 4-P3/8
  - [-1, 3, C3, [256]]                # 5
  - [-1, 1, Conv, [512, 3, 2]]        # 6-P4/16
  - [-1, 3, C3, [512]]                # 7
  - [-1, 1, Conv, [1024, 3, 2]]       # 8-P5/32
  - [-1, 1, SPP, [1024, [5, 9, 13]]]  # 9
  - [-1, 1, TRANS, [1024]]      # 10 (Add TRANS here)


# YOLOv5-MSFT head
head:
  - [[5, 7, 10], 1, BiFPN, [[256, 512, 1024], 256]]  # Inputs from layers 5, 7, 10; output 256 channels
  - [[-1, -2, -3], 1, Detect, [nc, anchors]]  # Detection head